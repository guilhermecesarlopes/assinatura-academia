name: Deploy

# Staging: Cloudflare Workers Builds faz o deploy a cada push em main (configurado no painel da Cloudflare).
# Aqui: disparo manual (production com aprovação no Environment "production", ou staging se precisar).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    concurrency: deploy-${{ github.event_name == 'push' && 'staging' || inputs.target }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migração roda ANTES do deploy, com o usuário "migrator" (DDL).
      - name: Migrar banco
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATOR }}

      # account_id fica no wrangler.toml; o DATABASE_URL do Worker vem do GitHub Environment.
      - name: Deploy API (Cloudflare Workers)
        working-directory: apps/api
        run: |
          pnpm exec wrangler deploy --env "$TARGET"
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
